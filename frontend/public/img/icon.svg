<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Django Content Studio</title>
  <desc id="d">App icon: a letter D formed from rounded horizontal lines on a dark mist-gray rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b585b"/>
      <stop offset="1" stop-color="#161b1d"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- letter D built from text lines -->
  <g fill="#f1f3f3">
    <rect x="121" y="130" width="201" height="30" rx="15"/>
    <rect x="121" y="176" width="250" height="30" rx="15"/>
    <rect x="121" y="222" width="268" height="30" rx="15"/>
    <rect x="121" y="268" width="268" height="30" rx="15"/>
    <rect x="121" y="314" width="250" height="30" rx="15"/>
    <rect x="121" y="360" width="201" height="30" rx="15"/>
  </g>
</svg>