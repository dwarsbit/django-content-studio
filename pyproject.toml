[project]
name = "django-content-studio"
version = "1.2.0"
description = "A modern Django admin alternative, batteries included"
authors = [
    {name = "Leon van der Grient", email = "leon@dwarsbit.nl"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<7",
    "djangorestframework>=3.17.2,<4",
    "nh3>=0.3.0,<1.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "rich>=14.3.3,<15",
    "pyjwt>=2,<3",
    "pick>=2.5,<3",
    "packaging>=23",
]
keywords = [
    "django",
    "django-admin",
    "admin",
    "admin-interface",
    "content-management",
    "react",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.urls]
Homepage = "https://djangocontentstudio.org/"
Documentation = "https://djangocontentstudio.org/docs/intro"
Repository = "https://github.com/dwarsbit/django-content-studio"
Issues = "https://github.com/dwarsbit/django-content-studio/issues"
Changelog = "https://github.com/dwarsbit/django-content-studio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
excel = ["openpyxl (>=3.1,<4)"]

[tool.poetry]
packages = [{include = "content_studio"}]
include = [
    { path = "content_studio/static/**/*", format = "sdist" },
    { path = "content_studio/static/**/*", format = "wheel" }]

[tool.poetry.group.dev.dependencies]
black = "26.10.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-django = "4.14.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
