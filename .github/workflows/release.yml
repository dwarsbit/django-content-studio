name: Release

# Bumps the version everywhere, commits it to main and pushes the tag
# vX.Y.Z, which triggers the Publish workflow. The push uses the
# RELEASE_TOKEN secret (a fine-grained PAT with contents: write) because
# pushes made with GITHUB_TOKEN do not trigger other workflows.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z or X.Y.Z-rc.N, without the v)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Require green CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --workflow ci.yml --branch main --commit "$sha" \
            --event push --limit 1 --json status,conclusion \
            --jq '.[0] | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on $sha is '$conclusion', not 'success'."
            exit 1
          fi

      - name: Bump the version
        run: python scripts/bump_version.py "${{ inputs.version }}"

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
