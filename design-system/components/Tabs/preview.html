<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tabs preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h(C.Tabs, { defaultValue: "content" },
  h(C.TabsList, null,
    h(C.TabsTrigger, { value: "content" }, "Content"),
    h(C.TabsTrigger, { value: "seo" }, "SEO"),
    h(C.TabsTrigger, { value: "history" }, "History")),
  h(C.TabsContent, { value: "content" }, "The article's title, body and status."),
  h(C.TabsContent, { value: "seo" }, "Search title and description."),
  h(C.TabsContent, { value: "history" }, "Every change, newest first.")));
</script>
</body>
</html>
