<!doctype html>
<html>
<head><meta charset="utf-8"><title>Form preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
function Demo() {
  var form = C.useForm({ defaultValues: { title: "Spring launch", slug: "" } });
  React.useEffect(function () { form.setError("slug", { message: "Enter a slug, such as spring-launch." }); }, []);
  function field(name, label, help) {
    return h(C.FormField, { control: form.control, name: name, render: function (p) {
      return h(C.FormItem, null, h(C.FormLabel, null, label), h(C.FormControl, null, h(C.Input, p.field)),
        help && h(C.FormDescription, null, help), h(C.FormMessage));
    } });
  }
  return h(C.Form, form, h("form", { className: "col", onSubmit: function (e) { e.preventDefault(); } },
    field("title", "Title", "Shown as the page heading."), field("slug", "Slug")));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
