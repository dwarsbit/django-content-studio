<!doctype html>
<html>
<head><meta charset="utf-8"><title>MultiSelect preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
var OPTIONS = [
  { value: "news", label: "News" }, { value: "release", label: "Release notes" },
  { value: "guides", label: "Guides" }, { value: "events", label: "Events" },
  { value: "company", label: "Company" }, { value: "jobs", label: "Jobs" }];
function Demo() {
  var s = React.useState([OPTIONS[0], OPTIONS[2]]);
  return h("div", { className: "col" },
    h(C.MultiSelect, { options: OPTIONS, value: s[0], onChange: s[1], placeholder: "Add categories",
      emptyIndicator: h("p", { style: { textAlign: "center", padding: 8 } }, "No categories found.") }));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
