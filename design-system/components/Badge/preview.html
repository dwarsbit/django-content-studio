<!-- @dsCard group="Display" height=96 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "col" },
  h("div", { className: "row" },
    h(C.Badge, null, "Published"),
    h(C.Badge, { variant: "secondary" }, "Draft"),
    h(C.Badge, { variant: "outline" }, "3 tags"),
    h(C.Badge, { variant: "destructive" }, "In trash")),
  h("div", { className: "row" },
    h(C.Badge, { tone: "gray" }, "Archived"),
    h(C.Badge, { tone: "blue" }, "Scheduled"),
    h(C.Badge, { tone: "green" }, "Published"),
    h(C.Badge, { tone: "yellow" }, "In review"),
    h(C.Badge, { tone: "red" }, "Rejected"),
    h(C.Badge, { tone: "purple" }, "Featured"))));
</script>
</body>
</html>
