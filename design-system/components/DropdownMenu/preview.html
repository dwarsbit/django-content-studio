<!doctype html>
<html>
<head><meta charset="utf-8"><title>DropdownMenu preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h(C.DropdownMenu, { open: true, modal: false },
  h(C.DropdownMenuTrigger, { className: C.buttonVariants({ variant: "outline" }) }, "Actions"),
  h(C.DropdownMenuContent, { align: "start", className: "w-52" },
    h(C.DropdownMenuLabel, null, "Spring launch"),
    h(C.DropdownMenuGroup, null,
      h(C.DropdownMenuItem, null, "Edit", h(C.DropdownMenuShortcut, null, "E")),
      h(C.DropdownMenuItem, null, "Duplicate"),
      h(C.DropdownMenuCheckboxItem, { checked: true }, "Featured")),
    h(C.DropdownMenuSeparator),
    h(C.DropdownMenuItem, { variant: "destructive" }, "Move to trash"))));
</script>
</body>
</html>
