<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h(C.Dialog, { open: true },
  h(C.DialogContent, null,
    h(C.DialogHeader, null,
      h(C.DialogTitle, null, "Delete this article?"),
      h(C.DialogDescription, null, "\u201cSpring launch announcement\u201d moves to the trash. You can restore it from there.")),
    h(C.DialogFooter, null,
      h(C.Button, { variant: "outline" }, "Cancel"),
      h(C.Button, { variant: "destructive" }, "Delete")))));
</script>
</body>
</html>
