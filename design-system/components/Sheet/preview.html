<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sheet preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h(C.Sheet, { open: true },
  h(C.SheetContent, null,
    h(C.SheetHeader, null,
      h(C.SheetTitle, null, "Image details"),
      h(C.SheetDescription, null, "spring-launch-hero.jpg \u00b7 1600 \u00d7 900")),
    h("div", { style: { display: "grid", gap: 6, padding: "0 16px" } },
      h(C.Label, { htmlFor: "alt" }, "Alternative text"),
      h(C.Input, { id: "alt", value: "Team on stage at the spring launch", onChange: function () {} })),
    h(C.SheetFooter, null, h(C.Button, null, "Save")))));
</script>
</body>
</html>
