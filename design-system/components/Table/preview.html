<!doctype html>
<html>
<head><meta charset="utf-8"><title>Table preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
var rows = [["Spring launch announcement", "Published", "12 Oct 2026"], ["Behind the redesign", "Draft", "9 Oct 2026"], ["Release notes 1.0", "In review", "2 Oct 2026"]];
ReactDOM.createRoot(document.getElementById("root")).render(h(C.Table, null,
  h(C.TableHeader, null, h(C.TableRow, null,
    h(C.TableHead, null, "Title"), h(C.TableHead, null, "Status"), h(C.TableHead, null, "Published"))),
  h(C.TableBody, null, rows.map(function (r) {
    return h(C.TableRow, { key: r[0] }, h(C.TableCell, null, r[0]), h(C.TableCell, null, r[1]), h(C.TableCell, null, r[2]));
  }))));
</script>
</body>
</html>
