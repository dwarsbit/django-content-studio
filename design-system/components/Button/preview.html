<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "col" },
  h("div", { className: "row" },
    h(C.Button, null, "Save"),
    h(C.Button, { variant: "outline" }, "Preview"),
    h(C.Button, { variant: "secondary" }, "Duplicate"),
    h(C.Button, { variant: "ghost" }, "Cancel"),
    h(C.Button, { variant: "destructive" }, "Delete"),
    h(C.Button, { variant: "link" }, "View history")),
  h("div", { className: "row" },
    h(C.Button, { size: "xs" }, "Extra small"),
    h(C.Button, { size: "sm" }, "Small"),
    h(C.Button, { size: "lg" }, "Large"),
    h(C.Button, { isLoading: true }, "Saving"),
    h(C.Button, { disabled: true }, "Disabled"))));
</script>
</body>
</html>
