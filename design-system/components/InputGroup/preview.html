<!doctype html>
<html>
<head><meta charset="utf-8"><title>InputGroup preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "col" },
  h(C.InputGroup, null,
    h(C.InputGroupAddon, null, h(C.InputGroupText, null, "/blog/")),
    h(C.InputGroupInput, { value: "spring-launch", onChange: function () {} })),
  h(C.InputGroup, null,
    h(C.InputGroupInput, { placeholder: "Folder name" }),
    h(C.InputGroupAddon, { align: "inline-end" }, h(C.InputGroupButton, null, "Save"))),
  h(C.InputGroup, null,
    h(C.InputGroupTextarea, { placeholder: "Write a short summary", rows: 2 }),
    h(C.InputGroupAddon, { align: "block-end" }, h(C.InputGroupText, null, "0 / 160")))));
</script>
</body>
</html>
